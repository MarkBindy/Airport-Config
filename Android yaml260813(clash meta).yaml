# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
# GEO规则订阅
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb"
# 嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    QUIC:
      ports: [443, 8443]
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
    - "+.googlevideo.com"
    parse-pure-ip: true
# 入站
tun:
  enable: true
  stack: mixed
  mtu: 1492
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.localdomain"
    - "localhost.ptlogin2.qq.com"
    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "+.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"
    - rule-set:fakeipfilter_domain
    - rule-set:cn_domain
# 默认解析服务器：仅用于解析本地策略组、订阅和一些基础的纯 IP 节点域名
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
# 严格的分流策略：国内域名绝不走海外，海外域名绝不走国内大厂
  nameserver-policy:
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
# 命中 Apple 服务的，走国内直连更顺畅
    "rule-set:apple_domain":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.cn":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.中国":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.公司":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.网络":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.google.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.googleapis.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.googleapis.cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.gstatic.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.gvt1.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.gvt2.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.gvt3.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.googleusercontent.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.ggpht.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.android.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.xn--ngstr-lra8j.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.openai.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.chatgpt.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.anthropic.com":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.claude.ai":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
# 基础查询服务器：当规则未命中时，默认的兜底海外加密 DNS（阻断局域网直接向运营商泄漏）
  nameserver:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  fallback:
    - 1.1.1.1
    - 8.8.8.8
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
# 节点域名解析服务器：使用国内安全加密的 DoH 专门解析你的机场节点域名
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
# 直流查询服务器
  direct-nameserver:
    - 223.6.6.6
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver-follow-policy: true

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    domain:
      - "+.openai.com"
      - "+.chatgpt.com"
      - "+.anthropic.com"
      - "+.claude.ai"
      - "+.google.com"
      - "+.googleapis.com"
      - "+.googleapis.cn"
      - "+.gstatic.com"
      - "+.gvt1.com"
      - "+.gvt2.com"
      - "+.gvt3.com"
      - "+.googleusercontent.com"
      - "+.ggpht.com"
      - "+.android.com"
      - "+.xn--ngstr-lra8j.com"
      - "+.googlevideo.com"
      - "+.youtube.com"
      - "+.ytimg.com"
      - "+.facebook.com"
      - "+.instagram.com"
      - "+.x.com"
      - "+.twitter.com"
      - "+.telegram.org"
    ipcidr:
      - 240.0.0.0/4
# 节点信息
proxies:
  - {name: 直连, type: direct}
# 机场订阅(分享给别人时,只需要在下方 url 行双引号内填入订阅链接,双引号不要删除,即可保存)
proxy-providers:
  Airport:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=24396c91ce75be76fe3fec072858b1f0"
    interval: 86400
    path: ./proxy_providers/Airport.yaml
    proxy: 直连
    exclude-type: "macc"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
