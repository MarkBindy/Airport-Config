# 节点信息
proxies:
  - {name: 直连, type: direct}

# 策略出站/区域锚点
Anchor_PG: &Anchor_PG {type: select, include-all: true, proxies: [🇭🇰 香港-故转, 🇹🇼 台湾-故转, 🇯🇵 日本-故转, 🇰🇷 韩国-故转, 🇸🇬 狮城-故转, 🇬🇧 英国-故转, 🇺🇸 美国-故转, ♻️ 其他-故转, 🇭🇰 香港-自动, 🇹🇼 台湾-自动, 🇯🇵 日本-自动, 🇰🇷 韩国-自动, 🇸🇬 狮城-自动, 🇬🇧 英国-自动, 🇺🇸 美国-自动, ♻️ 其他-自动, 🌐 全部-自动]}
Anchor_FB: &Anchor_FB {type: fallback, empty-fallback: REJECT, interval: 60, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204'}
Anchor_ST: &Anchor_ST {type: select, empty-fallback: REJECT, include-all: true}
Anchor_UT: &Anchor_UT {type: url-test, empty-fallback: REJECT, interval: 180, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50, include-all: true}
Anchor_HK: &Anchor_HK '(?i)^(?=.*(香港|(?<![a-zA-Z])(HK|hk|hkg)(?![a-zA-Z])|Hong|Hong Kong|HongKong|hong kong|hongkong|🇭🇰)).*$'
Anchor_TW: &Anchor_TW '(?i)^(?=.*(台湾|台灣|(?<![a-zA-Z])(TW|tw|tpe|khh|tsa)(?![a-zA-Z])|Tai|Tai Wan|TaiWan|tai wan|taiwan|taipei|🇹🇼)).*$'
Anchor_JP: &Anchor_JP '(?i)^(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<![a-zA-Z])(JP|jp|nrt|hnd|kix|cts|fuk)(?![a-zA-Z])|Japan|japan|Tokyo|tokyo|🇯🇵)).*$'
Anchor_KR: &Anchor_KR '(?i)^(?=.*(韩国|韓國|首尔|春川|(?<![a-zA-Z])(KR|kr|icn|gmp|pus)(?![a-zA-Z])|Korea|korea|seoul|🇰🇷)).*$'
Anchor_SG: &Anchor_SG '(?i)^(?=.*(新加坡|狮城|(?<![a-zA-Z])(SG|sg|sin|xsp)(?![a-zA-Z])|Singapore|singapore|🇸🇬)).*$'
Anchor_GB: &Anchor_GB '(?i)^(?=.*(英国|伦敦|(?<![a-zA-Z])(UK|uk|G B|g b|sfo|jfk|sjc|MAD|BCN)(?![a-zA-Z])|United Kingdom|united Kingdom|Great Britain|great britain|🇬🇧)).*$'
Anchor_US: &Anchor_US '(?i)^(?=.*(美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|(?<![a-zA-Z])(US|us|usa|lax|sfo|jfk|sjc)(?![a-zA-Z])|America|america|United States|united states|States|🇺🇸)).*$'
Anchor_OT: &Anchor_OT '^((?!(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|直连|DIRECT|香港|HK|hk|hkg|Hong|Hong Kong|HongKong|hong kong|hongkong|🇭🇰|台湾|台灣|TW|tw|tpe|khh|tsa|Tai|Tai Wan|TaiWan|tai wan|taiwan|taipei|🇹🇼|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|jp|nrt|hnd|kix|cts|fuk|Japan|japan|Tokyo|tokyo|🇯🇵|韩国|韓國|首尔|春川|KR|kr|icn|gmp|pus|Korea|korea|seoul|🇰🇷|新加坡|狮城|SG|sg|sin|xsp|Singapore|singapore|🇸🇬|英国|伦敦|UK|uk|G B|g b|sfo|jfk|sjc|MAD|BCN|United Kingdom|united Kingdom|Great Britain|great britain|🇬🇧|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|US|us|usa|lax|sfo|jfk|sjc|America|america|United States|united states|States|🇺🇸)).)*$'
Anchor_AL: &Anchor_AL '^((?!(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|直连|DIRECT)).)*$'

# 策略组(出站)
proxy-groups:
  - {name: 🚀 默认代理,   <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/Rocket.png}
  - {name: 🍀 Google,    <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/Google.png}
  - {name: 🤖 Ai,        <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/ChatGPT.png}
  - {name: 📹 YouTube,   <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/YouTube.png}
  - {name: 🎵 TikTok,    <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/TikTok.png}
  - {name: 🎥 NETFLIX,   <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/Netflix.png}
  - {name: 📲 Telegram,  <<: *Anchor_PG, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icon/qure/color/Telegram.png}
