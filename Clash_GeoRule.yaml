# 版本： V2026.8.16
# 地址： https://raw.githubusercontent.com/MarkBindy/Airport-Config/refs/heads/main/Clash_GeoRule.yaml
# 说明： 使用前需补充完整机场信息 “订阅链接” 与 “机场名” 即可保存



# 机场订阅锚点
Anchor_AP: &Anchor_AP {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}}
# ════════Airport机场订阅═════════
# 如有多条机场信息,下方开头处 “机场名” 不能重复,最后的 “机场名” 作为添加节点的名称前缀,可自定义
# 下方双引号内 “订阅链接” 替换为所用机场的订阅链接 <双引号不要删除>
proxy-providers:
  机场名: {<<: *Anchor_AP, url: "订阅链接", override: {additional-prefix: "[机场名]"}}

# 全局配置 
port: 7890                                        # 监听端口  HTTP(S) 代理端口
socks-port: 7891                                  # 监听端口  SOCKS5 代理端口
redir-port: 7892                                  # 监听端口  重定向代理端口
mixed-port: 7893                                  # 监听端口  HTTP + SOCKS5 混合代理端口
tproxy-port: 7895                                 # 监听端口  透明代理端口
allow-lan: true                                   # 局域连接  是否允许局域网设备连接
bind-address: "*"                                 # 监听接口  监听的网络接口（* 表示所有接口）
mode: rule                                        # 工作模式  rule（规则模式）/ global（全局模式）/ direct（直连模式）
ipv6: false                                       # 网络协议  是否启用 IPv6 支持
log-level: warning                                # 日志级别  silent（静默）/ error（错误）/ warning（警告）/ info（信息）/ debug（调试）
unified-delay: true                               # 统一延迟  减少节点延迟抖动
tcp-concurrent: true                              # 并发连接  提升多任务性能
keep-alive-idle: 600                              # TCP保活时间
keep-alive-interval: 15                           # TCP保活时间间隔
global-ua: clash-verge                            # 用户代理  全局默认UA
profile:
  store-selected: true                            # 保存选择  记住选择的节点和策略组
  store-fake-ip: true                             # 保存选择  Fake-IP 映射
geodata-loader: standard                          # geo数据加载模式 standard（标准）memconservative（低内存）
experimental:
  quic-go-disable-gso: true                       # 禁用 QUIC 防止 YouTube 等使用 QUIC 导致速度不佳

# GEO规则订阅
geodata-mode: true                                # 数据分流  使用数据集进行规则与分流匹配
geo-auto-update: true                             # 自动更新  geodata
geo-update-interval: 24                           # 更新间隔  单位：小时
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb"

# 入站
tun:
  enable: true                                    # 网卡模式  是否启用 TUN 虚拟网卡模式  
  stack: mixed                                    # 协议类型  网络栈：system（系统栈）/ gvisor（内置用户态栈）/ mixed（混合）
  mtu: 1492
  dns-hijack: [udp://any:53, tcp://any:53]        # 劫持请求  劫持所有 UDP/TCP 53 端口的 DNS 请求
  auto-detect-interface: true                     # 自动出口  自动识别默认出口网络接口 （仅内核模式有效）
  auto-route: true                                # 自动路由  自动添加系统路由表      （仅内核模式有效）
  auto-redirect: true                             # 自动定向  自动将流量重定向至 TUN  （仅内核模式有效）
  strict-route: false                             # 路由模式  严格路由模式
  endpoint-independent-nat: true                  # 端点无关  NAT（提高 NAT 类型兼容性，适用于 P2P 和游戏）
  route-exclude-address-set: [cn_ip]              # 绕过大陆  匹配大陆IP-CIDR（流量不进入代理）

# 嗅探
sniffer:
  enable: true                                    # 启用嗅探  提升分流准确性
  override-destination: true                      # 成功解析  使用嗅探到的域名覆盖原始目标地址
  parse-pure-ip: true                             # 反向解析  解析纯 IP 连接（尝试反向解析获得域名）
  force-dns-mapping: true                         # 强制映射  DNS 映射（对纯 IP 连接尝试 DNS 映射）
  sniff:
    QUIC: { ports: [443, 8443] }                  # 嗅探参数  QUIC 协议流量（HTTP/3 常用端口）
    TLS:  { ports: [443, 8443] }                  # 嗅探参数  HTTPS（TLS）常用及备用端口
    HTTP: { ports: [80, 8080-8880] }              # 嗅探参数  HTTP 及常见 Web / 代理端口段
  force-domain:
    - "+.netflix.com"                             # 强制嗅探  Netflix 主域名
    - "+.nflxvideo.net"                           # 强制嗅探  Netflix CDN
    - "+.amazonaws.com"                           # 强制嗅探  AWS 云服务
    - "+.media.dssott.com"                        # 强制嗅探  Disney+ 流媒体
    - "+.tiktok.com"                              # 强制嗅探  TikTok 流媒体
  skip-domain:
    - Mijia Cloud                                 # 跳过嗅探  米家云服务
    - dlg.io.mi.com                               # 跳过嗅探  小米设备通信
    - "+.oray.com"                                # 跳过嗅探  花生壳服务
    - "+.sunlogin.net"                            # 跳过嗅探  向日葵远程控制
    - "+.push.apple.com"                          # 跳过嗅探  苹果推送服务

# DNS模块
dns:
  enable: true                                    # 解析服务  启用 Clash 内置 DNS 服务
  listen: 0.0.0.0:1053                            # 监听服务  DNS 服务监听地址与端口
  cache-algorithm: arc                            # 缓存算法
  ipv6: false                                     # 网络协议  启用 IPv6 DNS 解析支持
  prefer-h3: false                                # 首选H3
  use-hosts: true                                 # 使用主机hosts
  use-system-hosts: true                          # 使用系统hosts
  respect-rules: true                             # 遵循规则  强制遵循规则顺序
  enhanced-mode: fake-ip                          # 增强模式  FDNS 增强模式（Fake-IP，用于防止 DNS 泄露）
  fake-ip-range: 198.18.0.1/16                    # 虚拟地址  Fake-IP 虚拟地址池范围
  fake-ip-filter-mode: blacklist                  # 过滤模式  Fake-IP 过滤模式（命中规则则返回真实 IP）
  fake-ip-filter:
    - "*.lan"                                     # 真实解析  常见局域网域名后缀
    - "*.local"
    - "+.localdomain"
    - "localhost.ptlogin2.qq.com"
    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "+.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"
    - "rule-set:fakeipfilter_domain"
    - "rule-set:add_direct_domain"                 # 真实解析  大陆冷门域名
    - "geosite:cn"                                 # 真实解析  大陆域 GeoSite 数据
    - "rule-set:cn_domain"                         # 真实解析  大陆域名
  default-nameserver:                              # 默认解析服务器：仅用于解析本地策略组、订阅和一些基础的纯 IP 节点域名
    - 1.1.1.1
    - 8.8.8.8
  nameserver-policy:                               # 严格的分流策略：国内域名绝不走海外，海外域名绝不走国内大厂
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:apple_domain":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.cn":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.中国":
      - 223.6.6.6
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.公司":
      - 223.6.6.6
      - 223.5.5.5
