      - https://dns.google/dns-query
  fallback:                                       # 备用查询服务器
    - 1.0.0.1
    - 8.8.4.4
    - https://dns.cloudflare.com/dns-query
    - https://1dot1dot1dot1.cloudflare-dns.com/
  fallback-filter:                                # 备用过滤器
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
