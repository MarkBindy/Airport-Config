# 节点信息
proxies:
  - {name: 直连, type: direct}

# 策略出站锚点
Anchor_PG: &Anchor_PG {type: select, proxies: [🌐 全部-手动, 🌐 全部-自动, 🇭🇰 香港-故转, 🇹🇼 台湾-故转, 🇯🇵 日本-故转, 🇰🇷 韩国-故转, 🇸🇬 狮城-故转, 🇬🇧 英国-故转, 🇺🇸 美国-故转, ♻️ 其他-故转]}
Anchor_FB: &Anchor_FB {type: fallback, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, url: 'https://www.gstatic.com/generate_204'}
Anchor_ST: &Anchor_ST {type: select, empty-fallback: REJECT, include-all: true}
Anchor_UT: &Anchor_UT {type: url-test, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, url: 'https://www.gstatic.com/generate_204', tolerance: 50, include-all: true}
# 区域锚点
Anchor_HK: &Anchor_HK '(?=.*(香港|HK|hk|hkg|(?i)hongkong|hong kong|Hong|🇭🇰))^((?!(台|日|韩|新|英|美)).)*$'
Anchor_TW: &Anchor_TW '(?=.*(台湾|TW|台灣|Tai Wan|TaiWan|tw|tpe|khh|tsa|(?i)tai|taiwan|taipei|🇹🇼))^((?!(港|日|韩|新|英|美)).)*$'
Anchor_JP: &Anchor_JP '(?=.*(日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|jp|nrt|hnd|kix|cts|fuk|(?i)Japan|japan|tokyo|🇯🇵))^((?!(港|台|韩|新|英|美)).)*$'
Anchor_KR: &Anchor_KR '(?=.*(韩国|KR|韓國|KR|首尔|春川|kr|icn|gmp|pus|(?i)Korea|korea|seoul|🇰🇷))^((?!(港|台|日|新|英|美)).)*$'
Anchor_SG: &Anchor_SG '(?=.*(新加坡|狮|SG|sg|sin|xsp|(?i)Singapore|singapore|🇸🇬))^((?!(港|台|日|韩|英|美)).)*$'
Anchor_GB: &Anchor_GB '(?=.*(英国|UK|伦敦|London|(?i)United Kingdom|🇬🇧))^((?!(港|台|日|韩|新|美)).)*$'
Anchor_US: &Anchor_US '(?=.*(美国|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|United States|us|usa|lax|sfo|jfk|sjc|(?i)States|America|america|united states|🇺🇸))^((?!(港|台|日|韩|新|英)).)*$'
Anchor_OT: &Anchor_OT '^((?!(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|直连|DIRECT|香港|HK|hk|hkg|hongkong|hong kong|Hong|🇭🇰|台湾|TW|台灣|Tai Wan|TaiWan|tw|tpe|khh|tsa|tai|taiwan|taipei|🇹🇼|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|jp|nrt|hnd|kix|cts|fuk|Japan|japan|tokyo|🇯🇵|韩国|KR|韓國|KR|首尔|春川|kr|icn|gmp|pus|Korea|korea|seoul|🇰🇷|新加坡|狮|SG|sg|sin|xsp|Singapore|singapore|🇸🇬|英国|UK|伦敦|London|United Kingdom|🇬🇧|美国|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|United States|us|usa|lax|sfo|jfk|sjc|States|America|america|united states|🇺🇸|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW)).)*$'
Anchor_AL: &Anchor_AL '^((?!(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|直连|DIRECT)).)*$'
# 策略组(出站)
proxy-groups:
  - {name: 默认代理,   <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/Rocket.png}
  - {name: Google,    <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/Google.png}
  - {name: Ai,        <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/ChatGPT.png}
  - {name: YouTube,   <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/YouTube.png}
  - {name: TikTok,    <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/TikTok.png}
  - {name: NETFLIX,   <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/Netflix.png}
  - {name: Telegram,  <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/Telegram.png}
  - {name: GitHub,    <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/GitHub.png}
  - {name: Speedtest, <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/Speedtest.png}
  - {name: 漏网之鱼,   <<: *Anchor_PG, include-all: true, icon: https://github.com/MarkBindy/Airport-Config/raw/main/icons/MATCH.png}
  # 香港组
  - {name: 🇭🇰 香港-故转,  <<: *Anchor_FB, proxies: [🇭🇰 香港-手动, 🇭🇰 香港-自动]}
  - {name: 🇭🇰 香港-手动,  <<: *Anchor_ST, filter: *Anchor_HK}
  - {name: 🇭🇰 香港-自动,  <<: *Anchor_UT, filter: *Anchor_HK}
  # 台湾组
  - {name: 🇹🇼 台湾-故转, <<: *Anchor_FB, proxies: [🇹🇼 台湾-手动, 🇹🇼 台湾-自动]}
  - {name: 🇹🇼 台湾-手动, <<: *Anchor_ST, filter: *Anchor_TW}
  - {name: 🇹🇼 台湾-自动, <<: *Anchor_UT, filter: *Anchor_TW}
  # 日本组
  - {name: 🇯🇵 日本-故转, <<: *Anchor_FB, proxies: [🇯🇵 日本-手动, 🇯🇵 日本-自动]}
  - {name: 🇯🇵 日本-手动, <<: *Anchor_ST, filter: *Anchor_JP}
  - {name: 🇯🇵 日本-自动, <<: *Anchor_UT, filter: *Anchor_JP}
  # 韩国组
  - {name: 🇰🇷 韩国-故转, <<: *Anchor_FB, proxies: [🇰🇷 韩国-手动, 🇰🇷 韩国-自动]}
  - {name: 🇰🇷 韩国-手动, <<: *Anchor_ST, filter: *Anchor_KR}
  - {name: 🇰🇷 韩国-自动, <<: *Anchor_UT, filter: *Anchor_KR}
  # 新加坡组
  - {name: 🇸🇬 狮城-故转, <<: *Anchor_FB, proxies: [🇸🇬 狮城-手动, 🇸🇬 狮城-自动]}
  - {name: 🇸🇬 狮城-手动, <<: *Anchor_ST, filter: *Anchor_SG}
  - {name: 🇸🇬 狮城-自动, <<: *Anchor_UT, filter: *Anchor_SG}
  # 英国组
  - {name: 🇬🇧 英国-故转, <<: *Anchor_FB, proxies: [🇬🇧 英国-手动, 🇬🇧 英国-自动]}
  - {name: 🇬🇧 英国-手动, <<: *Anchor_ST, filter: *Anchor_GB}
  - {name: 🇬🇧 英国-自动, <<: *Anchor_UT, filter: *Anchor_GB}
  # 美国组
  - {name: 🇺🇸 美国-故转, <<: *Anchor_FB, proxies: [🇺🇸 美国-手动, 🇺🇸 美国-自动]}
  - {name: 🇺🇸 美国-手动, <<: *Anchor_ST, filter: *Anchor_US}
